<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
     <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Tarefa </title>
      <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

        <!-- Compiled and minified CSS -->
         <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
        <link rel="stylesheet" href="css/style.css">
         <title>Agendar Tarefas</title>
</head>
<body>
   

    <div class="container">
        <h1 class= "center"> Agenda Médica</h1>
         <p class="center">Organizando meu dia!!</p>

        <ul class="center">
         <li>
            <i class="Small material-icons">event_note</i>
            Médico Importante!!
        </li>
        <li>Não esqueça seu compromisso!!!</li>  
     </ul>

     <p>Título: </p><input type="text" class="campoTitulo" />
     <p>Observações: </p> <input type="text" class="campo0bs" />
     <p>Medicamento: </p> <input type="text" class="campoMedicamento" />
     <p>Data e Hora: </p> <input type="datetime-local" class="campoDataHora"/>
     

<select class="campoPrioridade browser-default">
    <option value="">Selecione a prioridade</option>
    <option value="Alto">Alto</option>
    <option value="Médio">Médio</option>
    <option value="Baixo">Baixo</option>
</select>

<table class="highlight">
    <thead>
        <tr>
            <th>Tarefa</th>
            <th>Observações</th>
            <th>Medicamento</th>
            <th>Data e Hora</th>
            <th>Prioridade</th>
            <th>Apagar</th>
        </tr>
    </thead>
    <tbody>
    </tbody>
</table>


     <div class="divBotao">
        <a id="botao" class="btn-floating btn-large waves-effect waves-light red">
            <i class="material-icons">arrow_downward</i>
        </a>
    </div>
    <section class="tarefas">
        <table class="highight">
        <thead>
        
            <thead>
                <tr>
                    <th>Tarefa</th>
                    <th>Observações</th>
                    <th>Medicamento</th>
                    <th>Data e Hora</th>
                    <th>Prioridade</th>
                    <th>Apagar</th>
                </tr>

            </thead>
            <tbody>

            </tbody>
        </table>
    </section>

        <script src="js/jquery-3.5.1.js"></script>
        <script src="js/main.js"></script>
    
     </div>
        
    </body>
           
    
    
</html>
